name: rando_alerte
description: "Application de randonnée avec alertes météo et signalements communautaires"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  xml: ^6.6.1
  file_picker: ^11.0.2
  http: ^1.6.0
  url_launcher: ^6.1.11
  flutter_map_tile_caching: ^10.1.1
  flutter_secure_storage: ^9.0.0
  geocoding: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
